# NodeService — production stack. Запуск: `docker compose -f infra/compose.yaml up -d`
# (install.sh делает это за тебя и генерирует .env с секретами).
# Внутренние сервисы не публикуют порты наружу — всё идёт через Caddy (авто-HTTPS).
# Панель открыта через ваш nginx или Caddy — к этому файлу добавляется compose.host-proxy.yaml или
# compose.docker-proxy.yaml (выбирает установщик, см. scripts/compose-args.sh): свой Caddy тогда не запускается.

name: nodeservice

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    # Порт https — 443, на ноде с VPN установщик ставит 8443 (PANEL_HTTPS_PORT). UDP 443 занят (Hysteria2 и т. п.) —
    # HTTP/3 выключен (PANEL_PROTOCOLS), а UDP проброшен на случайный порт (PANEL_H3_PORT=0), чтобы не мешать.
    ports:
      - "80:80"
      - "${PANEL_HTTPS_PORT:-443}:${PANEL_HTTPS_PORT:-443}"
      - "${PANEL_H3_PORT:-${PANEL_HTTPS_PORT:-443}}:${PANEL_HTTPS_PORT:-443}/udp"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN не задан}
      PANEL_SITE: ${PANEL_DOMAIN}${PANEL_URL_PORT:-}
      PANEL_PROTOCOLS: ${PANEL_PROTOCOLS:-h1 h2 h3}
      # Caddy: `email` без значения — ошибка парсинга Caddyfile, поэтому переменная обязательна.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL не задан}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    <<: *logging

  api:
    image: ghcr.io/feauche/nodeservice-api:${NODESERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-dev}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
        APP_VERSION: ${NODESERVICE_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      # Сервер живёт в UTC независимо от часового пояса машины; браузер показывает своё время.
      TZ: UTC
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://nodeservice:${POSTGRES_PASSWORD}@postgres:5432/nodeservice
      VALKEY_URL: redis://valkey:6379
      PUBLIC_URL: https://${PANEL_DOMAIN}${PANEL_URL_PORT:-}
      # Резервные копии из панели («Настройки → Резервные копии»): та же папка, что у nodeservice backup;
      # .env установки — только на чтение (входит в копию); / — только на чтение, для «Дополнительных файлов».
      BACKUPS_DIR: /app/backups
      INSTALL_ENV_PATH: /app/install.env
      HOST_ROOT: /host
    volumes:
      - ../backups:/app/backups
      - ./.env:/app/install.env:ro
      - /:/host:ro,rslave
    # Только право читать любой файл — для упаковки дополнительных папок (например, /root/…).
    cap_add:
      - DAC_READ_SEARCH
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    mem_limit: 768m
    <<: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: nodeservice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: nodeservice
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeservice -d nodeservice"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    <<: *logging

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 192m
    <<: *logging

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  valkey_data:
