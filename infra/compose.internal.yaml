# Панель только во внутренней сети (установщик: «Только во внутренней сети»): без домена и сертификата.
# Свой Caddy не запускается; api слушает внутренний адрес сервера PANEL_LOCAL_BIND:PANEL_LOCAL_PORT
# (например, 10.10.10.104:80) — из интернета панель не открыть. Если у сервера нет ни одного внешнего адреса,
# PANEL_LOCAL_BIND=0.0.0.0: все адреса, в том числе VPN (NetBird, Tailscale). Адрес панели — http (PANEL_PUBLIC_URL):
# cookie без Secure, кнопки «Открыть в панели» в Telegram не ставятся. Прокси перед api нет, поэтому
# заголовку X-Forwarded-For не верим (TRUST_PROXY=0) — иначе адрес входа можно подделать.
services:
  caddy:
    profiles: ["off"]
  api:
    ports:
      - "${PANEL_LOCAL_BIND:?PANEL_LOCAL_BIND не задан}:${PANEL_LOCAL_PORT:?PANEL_LOCAL_PORT не задан}:3000"
    environment:
      PUBLIC_URL: ${PANEL_PUBLIC_URL:?PANEL_PUBLIC_URL не задан}
      TRUST_PROXY: "0"
