# Стабильный релиз панели: git tag v* → полные проверки → GitHub Release.
# `nodeservice update` выбирает последний опубликованный релиз; main остаётся каналом для теста.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Проверка и публикация
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nodeservice
          POSTGRES_PASSWORD: nodeservice
          POSTGRES_DB: nodeservice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nodeservice" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nodeservice:nodeservice@localhost:5432/nodeservice_test
      REDIS_URL: redis://localhost:6379
      CI: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Версия тега совпадает с панелью
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          [[ "$tag" == "$package" ]] || { echo "Тег v$tag, а package.json $package"; exit 1; }

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Подготовить метаданные образа
        id: image_meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Полная проверка
        env:
          APP_COMMIT: ${{ github.sha }}
          APP_BUILT_AT: ${{ steps.image_meta.outputs.built_at }}
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          bash infra/scripts/release-source.test.sh

      - name: Собрать changelog после прошлого релиза
        run: node scripts/release-notes.mjs --tag "${GITHUB_REF_NAME}" --update "nodeservice update" > release-notes.md

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать проверенный образ
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api
          tags: |
            ghcr.io/feauche/nodeservice-api:${{ github.ref_name }}
            ghcr.io/feauche/nodeservice-api:latest
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.image_meta.outputs.built_at }}
            APP_VERSION=${{ github.ref_name }}
            USE_PREBUILT=true

      - name: Записать проверяемый digest образа
        run: |
          printf '%s  %s\n' '${{ steps.image.outputs.digest }}' 'ghcr.io/feauche/nodeservice-api:${{ github.ref_name }}' > image-digest.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NodeService Panel ${{ github.ref_name }}
          body_path: release-notes.md
          files: image-digest.txt
