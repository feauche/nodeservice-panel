<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      const demoVariant = new URLSearchParams(location.search).get('v') || 'current';
      const viewport = document.createElement('meta');
      viewport.name = 'viewport';
      viewport.content =
        demoVariant === 'current'
          ? 'width=device-width,initial-scale=1'
          : 'width=device-width,initial-scale=1,viewport-fit=cover';
      document.head.append(viewport);
    </script>
    <meta name="theme-color" content="#10141b" />
    <title>NodeService · варианты мобильной шапки</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10141b;
        --surface: #171c25;
        --surface-2: #1d232e;
        --border: #2a3140;
        --text: #e9edf4;
        --muted: #737d8f;
        --accent: #6ea8fe;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #eef1f6;
        --surface: #ffffff;
        --surface-2: #f6f8fb;
        --border: #dfe4ec;
        --text: #1a2130;
        --muted: #8b95a7;
        --accent: #2f6fe0;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overscroll-behavior: none; }
      body { overflow: hidden; background: var(--bg); color: var(--text); font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      button, a { font: inherit; }
      .app { position: relative; display: flex; height: 100dvh; min-height: 0; flex-direction: column; overflow: hidden; background: var(--bg); }
      .header { position: relative; z-index: 5; display: flex; height: 58px; min-height: 58px; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
      .icon, .version, .avatar { display: grid; height: 36px; place-items: center; border: 1px solid var(--border); background: var(--surface); color: var(--muted); }
      .icon { width: 36px; border-radius: 10px; }
      .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 2; }
      .version { margin-left: auto; padding: 0 11px; border-radius: 10px; font: 600 11px ui-monospace, monospace; }
      .avatar { width: 36px; border: 0; border-radius: 10px; background: linear-gradient(145deg, #6ea8fe, #56c7b8); color: #0b1220; font-weight: 750; }
      .main { min-height: 0; flex: 1; overflow-y: auto; padding: 20px 16px 150px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      h1 { margin: 0 0 8px; font-size: 25px; letter-spacing: -.03em; }
      .lead { margin: 0 0 22px; color: var(--muted); line-height: 1.55; }
      .card { height: 112px; margin: 12px 0; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); }
      .controls { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); left: 10px; z-index: 20; padding: 10px; border: 1px solid var(--border); border-radius: 16px; background: color-mix(in srgb, var(--surface) 96%, transparent); box-shadow: 0 15px 45px #0006; }
      .controls strong { display: block; margin: 0 4px 8px; font-size: 12px; }
      .variants { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
      .variants a, .theme { min-width: 0; padding: 8px 4px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--muted); text-align: center; text-decoration: none; font-size: 11px; }
      .variants a[aria-current='page'] { border-color: var(--accent); color: var(--accent); }
      .theme { width: 100%; margin-top: 6px; color: var(--text); }
      .drawer-overlay { position: fixed; inset: 0; z-index: 30; display: none; background: #0007; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
      .drawer { position: absolute; inset: 0 auto 0 0; width: min(280px, 84vw); padding: calc(18px + env(safe-area-inset-top)) 18px 18px; background: var(--surface); transform: translateX(-100%); transition: transform .2s ease; }
      .drawer-overlay.open { display: block; }
      .drawer-overlay.open .drawer { transform: none; }
      .drawer button { float: right; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); }
      .drawer h2 { margin: 7px 0 28px; }
      .drawer p { clear: both; padding: 12px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }

      /* B: отдельная сплошная поверхность перекрывает safe area и всю шапку. */
      body[data-variant='safe-surface'] .app { padding-top: env(safe-area-inset-top); }
      body[data-variant='safe-surface'] .app::before { content: ''; position: fixed; inset: 0 0 auto; z-index: 4; height: calc(env(safe-area-inset-top) + 59px); background: var(--bg); }

      /* C: фон шапки рисуется её собственным изолированным слоем, продолженным вверх. */
      body[data-variant='isolated'] .app { padding-top: env(safe-area-inset-top); }
      body[data-variant='isolated'] .header { isolation: isolate; background: transparent; transform: translateZ(0); }
      body[data-variant='isolated'] .header::before { content: ''; position: absolute; inset: calc(-1 * env(safe-area-inset-top)) 0 0; z-index: -1; background: var(--bg); }

      /* D: единая полоса находится вне прокручиваемого каркаса; контент начинается после неё. */
      body[data-variant='fixed-strip'] .app { padding-top: calc(env(safe-area-inset-top) + 58px); }
      body[data-variant='fixed-strip'] .header { position: fixed; inset: env(safe-area-inset-top) 0 auto; }
      body[data-variant='fixed-strip']::before { content: ''; position: fixed; inset: 0 0 auto; z-index: 4; height: calc(env(safe-area-inset-top) + 59px); background: var(--bg); }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button class="icon" id="menu" aria-label="Открыть меню"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button>
        <button class="icon" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg></button>
        <span class="version">● v0.64.0</span>
        <button class="icon" id="themeIcon" aria-label="Сменить тему"><svg viewBox="0 0 24 24"><path d="M20 15.2A8 8 0 1 1 8.8 4 6.5 6.5 0 0 0 20 15.2Z" /></svg></button>
        <span class="avatar">LU</span>
      </header>
      <main class="main">
        <h1>Обзор</h1>
        <p class="lead" id="description"></p>
        <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
      </main>
    </div>
    <div class="controls">
      <strong>Проверьте верх шапки до и после открытия меню</strong>
      <nav class="variants">
        <a href="?v=current" data-v="current">A · сейчас</a>
        <a href="?v=safe-surface" data-v="safe-surface">B · слой</a>
        <a href="?v=isolated" data-v="isolated">C · изоляция</a>
        <a href="?v=fixed-strip" data-v="fixed-strip">D · полоса</a>
      </nav>
      <button class="theme" id="theme">Светлая / тёмная тема</button>
    </div>
    <div class="drawer-overlay" id="overlay">
      <aside class="drawer">
        <button id="close" aria-label="Закрыть">×</button>
        <h2>NodeService</h2>
        <p>Закройте меню и посмотрите, возвращается ли затемнение через полсекунды.</p>
      </aside>
    </div>
    <script>
      const descriptions = {
        current: 'A — текущая структура панели без дополнительного слоя. Это контрольный вариант.',
        'safe-surface': 'B — один сплошной фон закрывает системную safe area и шапку.',
        isolated: 'C — шапка рисуется на отдельном изолированном слое и продолжается под строку состояния.',
        'fixed-strip': 'D — верхняя полоса вынесена из прокручиваемого каркаса и закреплена отдельно.',
      };
      document.body.dataset.variant = demoVariant;
      document.querySelector(`[data-v="${demoVariant}"]`)?.setAttribute('aria-current', 'page');
      document.getElementById('description').textContent = descriptions[demoVariant] || descriptions.current;
      const overlay = document.getElementById('overlay');
      document.getElementById('menu').onclick = () => overlay.classList.add('open');
      document.getElementById('close').onclick = () => overlay.classList.remove('open');
      overlay.onclick = (event) => { if (event.target === overlay) overlay.classList.remove('open'); };
      const setTheme = (light) => {
        document.documentElement.toggleAttribute('data-theme', light);
        if (light) document.documentElement.dataset.theme = 'light';
        else document.documentElement.removeAttribute('data-theme');
        document.querySelector('meta[name="theme-color"]').content = light ? '#eef1f6' : '#10141b';
      };
      let light = matchMedia('(prefers-color-scheme: light)').matches;
      setTheme(light);
      document.getElementById('theme').onclick = () => { light = !light; setTheme(light); };
      document.getElementById('themeIcon').onclick = () => { light = !light; setTheme(light); };
    </script>
  </body>
</html>
